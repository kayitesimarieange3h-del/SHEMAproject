version: "3.9"

services:
  backend:
    container_name: shema-backend
    build: ./backend
    ports:
      - "5000:5000"
    restart: always
    networks:
      - shema-network

  frontend:
    container_name: shema-frontend
    build: ./frontend
    ports:
      - "8080:3000"
    restart: always
    depends_on:
      - backend
    networks:
      - shema-network

networks:
  shema-network:
    driver: bridge
